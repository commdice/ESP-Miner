# DQ96 lotto-miner monitoring stack for the Umbrel box (192.168.0.27).
# Grafana: http://192.168.0.27:3300  (login admin / value of GF_ADMIN_PASSWORD in .env)
# History is kept in ./data, so keep this folder on Umbrel's data drive. See README.md.
name: dq96-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus

  json-exporter:
    image: prometheuscommunity/json-exporter:v0.7.0
    restart: unless-stopped
    command: [--config.file=/config.yml]
    volumes:
      - ./json_exporter.yml:/config.yml:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command: [--config.file=/config.yml]
    volumes:
      - ./blackbox.yml:/config.yml:ro

  grafana:
    image: grafana/grafana-oss:11.3.1
    restart: unless-stopped
    ports:
      - "3300:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dq96.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
