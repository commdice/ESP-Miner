# Maps the miner's /api/system/info JSON to Prometheus metrics.
# Works with NerdQAxe and ESP-Miner (AxeOS) firmware; fields a firmware doesn't serve are skipped.
modules:
  axeos:
    metrics:
      - name: miner_hashrate_ghs
        path: '{ .hashRate }'
        help: Current hashrate (GH/s)
      - name: miner_hashrate_10m_ghs
        path: '{ .hashRate_10m }'
        help: 10 minute average hashrate (GH/s)
      - name: miner_hashrate_1h_ghs
        path: '{ .hashRate_1h }'
        help: 1 hour average hashrate (GH/s)
      - name: miner_power_watts
        path: '{ .power }'
        help: Power draw (W)
      - name: miner_chip_temp_celsius
        path: '{ .temp }'
        help: ASIC temperature (C)
      - name: miner_vr_temp_celsius
        path: '{ .vrTemp }'
        help: Voltage regulator temperature (C)
      - name: miner_fan_percent
        path: '{ .fanspeed }'
        help: Fan speed (%)
      - name: miner_fan_rpm
        path: '{ .fanrpm }'
        help: Fan speed (RPM)
      - name: miner_frequency_mhz
        path: '{ .frequency }'
        help: ASIC frequency (MHz)
      - name: miner_core_voltage_mv
        path: '{ .coreVoltageActual }'
        help: Measured core voltage (mV)
      - name: miner_shares_accepted
        path: '{ .sharesAccepted }'
        help: Accepted shares (resets on reboot/reconnect)
      - name: miner_shares_rejected
        path: '{ .sharesRejected }'
        help: Rejected shares (resets on reboot/reconnect)
      - name: miner_best_diff
        path: '{ .bestDiff }'
        help: Best difficulty ever
      - name: miner_best_session_diff
        path: '{ .bestSessionDiff }'
        help: Best difficulty since boot
      - name: miner_pool_difficulty
        path: '{ .poolDifficulty }'
        help: Current pool share difficulty
      - name: miner_uptime_seconds
        path: '{ .uptimeSeconds }'
        help: Seconds since boot
      - name: miner_wifi_rssi_dbm
        path: '{ .wifiRSSI }'
        help: WiFi signal (dBm)
      - name: miner_free_heap_bytes
        path: '{ .freeHeap }'
        help: Free heap (bytes)
      - name: miner_using_fallback
        path: '{ .isUsingFallbackStratum }'
        help: 1 when mining on the fallback pool
      - name: miner_pool_last_work_age_seconds
        path: '{ .poolHealth.lastWorkAge }'
        help: Seconds since the pool sent new work (-1 = not connected)
      - name: miner_pool_unanswered_age_seconds
        path: '{ .poolHealth.unansweredAge }'
        help: Seconds the oldest unanswered share has waited
      - name: miner_pool_reject_streak
        path: '{ .poolHealth.rejectStreak }'
        help: Consecutive rejected shares
      - name: miner_pool_health_actions
        path: '{ .poolHealth.actions }'
        help: Health failovers/reconnects since boot
      - name: miner_pool_primary_holddown_seconds
        path: '{ .poolHealth.primaryHolddown }'
        help: Seconds before primary pool is retried
      - name: miner_info
        type: object
        path: '{ @ }'
        help: Firmware version and hostname
        labels:
          version: '{ .version }'
          hostname: '{ .hostname }'
        values:
          info: 1
